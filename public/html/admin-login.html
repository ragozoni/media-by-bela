<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media by Bela — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="login-wrap">
  <form id="login-form" class="login-card">
    <h1>Media by Bela</h1>
    <p class="subtitle">Painel administrativo</p>

    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <p id="login-error" class="form-error"></p>

    <button type="submit" class="btn-primary">Entrar</button>
  </form>
</div>

<script src="../js/api-config.js"></script>
<script src="../js/admin-login.js"></script>

</body>
</html>
