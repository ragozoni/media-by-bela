server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 12m;

    # Repassa chamadas de API pro container do backend (Flask).
    # "backend" é o nome do serviço no docker-compose.yml — o Docker
    # resolve isso automaticamente na rede interna, sem precisar de IP.
    location /api/ {
        set $worker http://worker:8787;
        proxy_pass $worker$request_uri;
 
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
 
        # O Worker marca os cookies de sessão como "Secure" (correto em
        # produção, atrás do HTTPS da Cloudflare). Em Docker o acesso é
        # http://localhost:8080, então removemos a flag aqui — no nginx,
        # sem tocar no código do Worker. Se você colocar TLS na frente,
        # basta comentar esta linha.
        proxy_cookie_flags ~ nosecure;
 
        # Upload em streaming: não segura o arquivo inteiro em disco antes
        # de repassar, e dá folga de tempo para o upload ao Supabase.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
 
    # ---- Estáticos -------------------------------------------------------
    # $uri.html reproduz o "html_handling" da Cloudflare, que serve
    # /html/admin-login tanto quanto /html/admin-login.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
 
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
 
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
 
    # As páginas HTML não devem ficar em cache agressivo: o conteúdo do site
    # vem da API, mas a marcação muda a cada deploy.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
