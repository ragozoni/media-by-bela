server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Repassa chamadas de API pro container do backend (Flask).
    # "backend" é o nome do serviço no docker-compose.yml — o Docker
    # resolve isso automaticamente na rede interna, sem precisar de IP.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens enviadas pelo admin também vêm do backend
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
