services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-by-bela-frontend
    ports:
      - "${SITE_PORT:-8080}:80"
    depends_on:
      - worker
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
 
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: media-by-bela-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8787}:8787"
    volumes:
      # Segredos: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY
      - ./.dev.vars:/app/.dev.vars:ro
      # Hot reload do Worker: altere src/index.js e o workerd recarrega
      - ./src:/app/src:ro
      - ./wrangler.jsonc:/app/wrangler.jsonc:ro
      - ./public:/app/public:ro
      # node_modules fica SÓ na imagem (nunca vem do host, que pode ter
      # binários de outra plataforma).
